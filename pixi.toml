[workspace]
name = "pitchquery"
version = "0.1.0"
description = "Agent Moneyball: evidence-gated analysis for pitch-level TrackMan data"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
pandas = ">=2.2,<3"
fastapi = ">=0.115,<1"
uvicorn = ">=0.30,<1"
python-multipart = ">=0.0.9,<1"
python-dotenv = ">=1,<2"
pytest = ">=8,<9"
httpx = ">=0.27,<1"
nodejs = ">=20,<23"

[pypi-dependencies]
langchain = ">=1.2,<2"
langgraph = ">=1.0,<2"
langchain-openai = ">=1.1,<2"
openai = ">=2,<3"

[tasks]
test = "pytest backend/tests -q"
backend = "uvicorn backend.main:app --reload --reload-dir backend"
frontend-install = "cd frontend && npm install"
frontend = "cd frontend && npm run dev"
app = "python scripts/run_local.py"
typecheck = "cd frontend && npm run typecheck"
build = "cd frontend && npm run build"
check = "pytest backend/tests -q && cd frontend && npm run typecheck && npm run build"
seed-demo = "python scripts/seed_supabase_demo.py"
