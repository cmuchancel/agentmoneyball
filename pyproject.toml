[project]
name = "pitchquery-api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas>=2.2,<3",
  "langchain>=1.2,<2",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.1,<2",
  "openai>=2.0,<3",
  "pydantic>=2.8,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
]

[tool.vercel]
entrypoint = "backend.main:app"
